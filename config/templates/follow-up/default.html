<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background-color: #f4f4f4;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f4; padding: 20px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden;">
          <!-- Header -->
          <tr>
            <td style="background-color: {{brand_color}}; padding: 24px; text-align: center;">
              <img src="{{logo_url}}" alt="{{company_name}}" style="max-height: 48px;" />
            </td>
          </tr>
          <!-- Content -->
          <tr>
            <td style="padding: 32px 24px;">
              <h1 style="color: #1a1a2e; font-size: 22px; margin: 0 0 16px;">Hallo {{lead_name}},</h1>
              <div style="color: #333; font-size: 16px; line-height: 1.6;">
                {{content}}
              </div>
            </td>
          </tr>
          <!-- CTA -->
          <tr>
            <td style="padding: 0 24px 32px; text-align: center;">
              <a href="{{cta_url}}" style="display: inline-block; padding: 12px 32px; background-color: {{brand_color}}; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: bold;">
                {{cta_text}}
              </a>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background-color: #f8f9fa; padding: 20px 24px; text-align: center; font-size: 13px; color: #6b7280;">
              <p style="margin: 0;">{{company_name}}</p>
              <p style="margin: 4px 0;">{{contact_email}} | {{contact_phone}}</p>
              <p style="margin: 8px 0 0;">
                <a href="{{website_url}}" style="color: {{brand_color}}; text-decoration: none;">{{website_url}}</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
