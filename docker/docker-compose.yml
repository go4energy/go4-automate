services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: go4-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../config/.env
    volumes:
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - go4net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: go4-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - go4net

  postgres:
    image: postgres:16-alpine
    container_name: go4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: go4automate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - go4net

  redis:
    image: redis:7-alpine
    container_name: go4-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - go4net

volumes:
  postgres_data:
  redis_data:

networks:
  go4net:
    driver: bridge
