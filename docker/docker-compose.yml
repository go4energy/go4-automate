services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: go4-backend
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ../config/.env
    extra_hosts:
      # Lets the intel module reach the host-native Ollama service
      # (port 11434) for embeddings without leaking go4net into the
      # host network.
      - 'host.docker.internal:host-gateway'
    environment:
      INTEL_OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - go4net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: go4-frontend
    restart: unless-stopped
    ports:
      - '8081:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - go4net

  postgres:
    # pgvector/pgvector:pg16 is a drop-in replacement for postgres:16-alpine
    # — same PG16 binary, same data layout, only adds the pgvector extension
    # for the intel module's semantic-embedding diff (vector(1024)).
    # The extension itself is activated by alembic migration 089.
    image: pgvector/pgvector:pg16
    container_name: go4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: go4automate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - go4net

  redis:
    image: redis:7-alpine
    container_name: go4-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - go4net

  n8n:
    image: n8nio/n8n:latest
    container_name: go4-n8n
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '5678:5678'
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=https://n8n.go4.energy/
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_EDITOR_BASE_URL=https://n8n.go4.energy/
      - GENERIC_TIMEZONE=Europe/Vienna
      - API_BASE_URL=http://host.docker.internal:8000
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5678/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - go4net

  # XTTS läuft nativ auf dem Host (nicht als Container)
  # URL: http://localhost:8020

  # Intel-Worker — periodisch source-fetch + briefing-compose
  # Embeddings via host-native Ollama (port 11434, shared service);
  # erreicht über host.docker.internal:host-gateway extra_hosts mapping.
  intel-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: go4-intel-worker
    restart: unless-stopped
    command: ['python', 'run_intel_worker.py']
    env_file:
      - ../config/.env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      INTEL_OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - go4net

volumes:
  postgres_data:
  redis_data:
  n8n_data:

networks:
  go4net:
    driver: bridge
